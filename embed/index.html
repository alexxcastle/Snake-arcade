<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Snake Arcade Player</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1110;color:#eaffdf;font:14px ui-monospace,monospace}
.app{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;color:#9cff75;font-weight:900;letter-spacing:.08em}.stats{color:#c8d8c5;font-weight:400;letter-spacing:0}
.frame{position:relative;min-height:0;padding:6px;background:#17221b;border:2px solid #405b43;border-radius:8px;display:grid}
canvas{width:100%;height:100%;max-height:100%;aspect-ratio:1;object-fit:contain;display:block;background:#101a14;image-rendering:pixelated;touch-action:none}
.overlay{position:absolute;inset:6px;background:#08100edb;display:grid;place-items:center;text-align:center;padding:12px}.overlay[hidden]{display:none}.panel h2{color:#9cff75;letter-spacing:.12em;font-size:clamp(20px,5vw,30px)}.panel p{line-height:1.7;color:#c3d2c0}
button{border:0;border-radius:5px;background:#9cff75;color:#10200e;padding:10px 16px;font:900 13px ui-monospace;cursor:pointer}.bar{display:flex;justify-content:space-between;align-items:center;color:#91a58f;font-size:11px;gap:8px}.pad{display:grid;grid-template-columns:repeat(3,36px);gap:4px;justify-content:center}.pad button{padding:6px;background:#243729;color:white;border:1px solid #48634a}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
@media(max-height:480px){.app{padding:5px;gap:4px}.pad{grid-template-columns:repeat(3,30px)}.pad button{padding:3px}.bar{font-size:9px}}
</style></head><body><div class="app">
<header><span>SNAKE / ARCADE</span><span class="stats">SCORE <b id="score">0</b> &nbsp; BEST <b id="best">0</b></span></header>
<div class="frame"><canvas id="c" width="480" height="480"></canvas><div class="overlay" id="ov"><div class="panel"><h2 id="msg">SNAKE ARCADE</h2><p id="sub">EAT. GROW. DON'T GET CAUGHT.<br>ARROWS / WASD OR SWIPE</p><button id="start">START GAME</button></div></div></div>
<div class="bar"><span>SWIPE OR USE THE PAD · SPACE TO PAUSE</span><span><button id="pause">PAUSE</button> <button id="restart">↻</button></span></div>
<div class="pad"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div>
</div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),N=24,S=20,ov=document.getElementById('ov'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let snake,dir,next,food,score,best=0,timer=null,running=false,paused=false,dead=false;try{best=+(localStorage.getItem('snakeBest')||0)}catch{}bestEl.textContent=best;
function reset(){snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};next={...dir};score=0;scoreEl.textContent=0;dead=false;paused=false;foodAt();draw()}
function foodAt(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function draw(){x.fillStyle='#101a14';x.fillRect(0,0,480,480);x.strokeStyle='#1a2a20';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,480);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(480,i*S);x.stroke()}x.fillStyle='#ff6b62';x.fillRect(food.x*S+4,food.y*S+4,12,12);snake.forEach((p,i)=>{x.fillStyle=i?'#70d957':'#d7ff9b';x.fillRect(p.x*S+2,p.y*S+2,16,16);if(!i){x.fillStyle='#173018';x.fillRect(p.x*S+5,p.y*S+6,3,3);x.fillRect(p.x*S+12,p.y*S+6,3,3)}})}
function stop(){running=false;clearInterval(timer)}function start(){if(dead)reset();running=true;paused=false;ov.hidden=true;clearInterval(timer);timer=setInterval(tick,105)}
function gameover(){stop();dead=true;document.getElementById('msg').textContent='GAME OVER';document.getElementById('sub').textContent='FINAL SCORE: '+score+' — TRY AGAIN';document.getElementById('start').textContent='PLAY AGAIN';ov.hidden=false}
function tick(){if(!running||paused)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some((p,i)=>i&&p.x===h.x&&p.y===h.y)){gameover();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('snakeBest',best)}catch{}}foodAt()}else snake.pop();draw()}
function turn(a,b){if(a===-dir.x&&b===-dir.y)return;next={x:a,y:b};if(!running&&!dead)start()}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(m[k]){e.preventDefault();turn(...m[k])}if(k===' '){e.preventDefault();toggle()}});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};turn(...m[b.dataset.d])});
let touch;c.addEventListener('touchstart',e=>{touch=[e.changedTouches[0].clientX,e.changedTouches[0].clientY]},{passive:true});c.addEventListener('touchend',e=>{if(!touch)return;let dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>18)Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy));touch=null},{passive:true});
function toggle(){if(!running)return;paused=!paused;ov.hidden=!paused;if(paused){document.getElementById('msg').textContent='PAUSED';document.getElementById('sub').textContent='TAKE A BREATHER';document.getElementById('start').textContent='RESUME'}}
document.getElementById('start').onclick=()=>{if(paused){paused=false;ov.hidden=true}else{reset();start()}};document.getElementById('pause').onclick=toggle;document.getElementById('restart').onclick=()=>{stop();reset();start()};reset()})();
</script></body></html>
